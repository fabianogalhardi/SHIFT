; Configuração do robô de exames da UTI (sem senhas — as senhas ficam no
; Gerenciador de Credenciais do Windows, gravadas pelo configurar.bat).

[elis]
url_login = https://shift.hospitaldeamor.com.br/shift/lis/hcb/elis/s01.iu.web.Login.cls
; Nome do setor como aparece no eLIS (o robô procura por ele nas telas).
setor = UTI PEDIÁTRICA
; Quantas horas para trás buscar exames liberados (24 = desde as 6h de ontem).
janela_horas = 24
; Seletores opcionais do login. Deixe em branco para detecção automática.
seletor_usuario =
seletor_senha =
seletor_botao_entrar =

[notion]
; Páginas do Notion (IDs tirados dos links).
pagina_prompt_digitar = 3e1405bc60848101b917dad982a70fbb
pagina_prompt_uti_ped = 3eb405bc608481f7a58cde913518210f
pagina_rotinas = 3d2405bc608480f6bdaee72a80526ba9

[claude]
modelo = claude-opus-5-5
; Limite de passos de navegação no eLIS por execução.
max_passos = 80
